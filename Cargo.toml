[package]
name = "minicore-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Embeddable MiniCore agent runtime"

[features]
default = []
heavy-tests = []

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.3"
regex-syntax = "=0.8.11"
same-file = "=1.0.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
file-id = "=0.2.3"
fs4 = { version = "0.13.1", default-features = false, features = ["sync"] }
futures-util = "0.3.33"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "test-util"] }
# M12: dev-only direct dep so the test-only HttpClientExt wrapper can name `bytes::Bytes`
# in trait signatures; resolves to the already-locked bytes version, adding no new crate.
bytes = "1.10.1"
# M12: dev-only probe of real rig-core 0.40.0 (default-features off; reqwest/rustls/test-utils only).
rig = { package = "rig-core", version = "=0.40.0", default-features = false, features = ["reqwest", "rustls", "test-utils"] }


[[test]]
name = "heavy_boundaries"
path = "tests/heavy_boundaries.rs"
required-features = ["heavy-tests"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
