[package]
name = "minicore-runtime"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Embeddable MiniCore agent runtime"

[dependencies]
getrandom = "0.3.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["parsing"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
futures-util = "0.3.33"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
