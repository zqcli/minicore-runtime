[package]
name = "minicore-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Embeddable MiniCore agent runtime"

[features]
default = []
heavy-tests = []

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.3"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing"] }

[dev-dependencies]
serde_json = { version = "1.0.140", features = ["raw_value"] }

[[test]]
name = "heavy_boundaries"
path = "tests/heavy_boundaries.rs"
required-features = ["heavy-tests"]

[lints.rust]
unsafe_code = "forbid"
