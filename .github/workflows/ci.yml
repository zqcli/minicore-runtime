name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: quality gate (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set stable
      - name: Install quality gate tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Run the quality gate
        run: ./scripts/check.sh

  native:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust toolchain
        run: rustup override set stable
      - name: Initialize Windows MSVC Developer Shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace(${env:ProgramFiles}) -and [string]::IsNullOrWhiteSpace(${env:ProgramFiles(x86)})) {
            throw 'Neither ProgramFiles nor ProgramFiles(x86) is set'
          }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
            throw 'GITHUB_ENV is not set'
          }

          $programFilesRoots = @(
            ${env:ProgramFiles}
            ${env:ProgramFiles(x86)}
          ) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd('\', '/') } |
            Sort-Object -Unique

          $candidates = @(
            foreach ($programFilesRoot in $programFilesRoots) {
              $pattern = Join-Path -Path $programFilesRoot -ChildPath 'Microsoft Visual Studio\*\*\Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
              Get-ChildItem -Path $pattern -File -Force -ErrorAction SilentlyContinue
            }
          )
          $candidates = @($candidates | Sort-Object -Property FullName -Unique)
          if ($candidates.Count -eq 0) {
            throw 'No Visual Studio Developer Shell was found under ProgramFiles or ProgramFiles(x86)'
          }
          if ($candidates.Count -ne 1) {
            $candidatePaths = $candidates.FullName -join ', '
            throw "Ambiguous Visual Studio Developer Shell candidates: $candidatePaths"
          }

          $candidateFile = $candidates[0]
          $toolsPath = Split-Path -Parent $candidateFile.FullName
          $common7Path = Split-Path -Parent $toolsPath
          if ((Split-Path -Leaf $toolsPath) -ne 'Tools' -or (Split-Path -Leaf $common7Path) -ne 'Common7') {
            throw "Visual Studio Developer Shell has an unexpected layout: $($candidateFile.FullName)"
          }
          $installationPath = [IO.Path]::GetFullPath((Split-Path -Parent $common7Path))
          $devShell = [IO.Path]::GetFullPath($candidateFile.FullName)
          if (-not (Test-Path -LiteralPath $devShell -PathType Leaf)) {
            throw "Visual Studio Developer Shell was not found: $devShell"
          }
          Import-Module -Name $devShell -Force -ErrorAction Stop
          if ($null -eq (Get-Command Enter-VsDevShell -ErrorAction SilentlyContinue)) {
            throw 'Enter-VsDevShell was not imported from the Visual Studio Developer Shell module'
          }

          Enter-VsDevShell -VsInstallPath $installationPath -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $linkerCommand = Get-Command -Name 'link.exe' -CommandType Application -All -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $linkerCommand) {
            throw 'Visual Studio Developer Shell did not put link.exe on PATH'
          }
          $installationRoot = [IO.Path]::GetFullPath($installationPath).TrimEnd('\', '/') + '\'
          $linkerPath = [IO.Path]::GetFullPath([string]$linkerCommand.Path)
          if (-not $linkerPath.StartsWith($installationRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "PATH-first link.exe is outside the selected Visual Studio installation: $linkerPath"
          }
          if ($linkerPath -match '(?i)(^|\\)Git(\\|$)') {
            throw "PATH-first link.exe resolves to Git: $linkerPath"
          }

          $requiredEnvironment = @(
            'PATH',
            'INCLUDE',
            'LIB',
            'LIBPATH',
            'VCINSTALLDIR',
            'VSINSTALLDIR',
            'VSCMD_ARG_TGT_ARCH',
            'WindowsSdkDir',
            'WindowsSDKVersion'
          )
          foreach ($name in $requiredEnvironment) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Visual Studio Developer Shell did not set required variable: $name"
            }
            if ($name -eq 'VSCMD_ARG_TGT_ARCH' -and $value -ne 'x64') {
              throw "Visual Studio Developer Shell selected unexpected target architecture: $value"
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value (('{0}={1}' -f $name, $value)) -Encoding utf8
          }
      - run: cargo test --all-targets --locked
      - run: cargo test --manifest-path provider-gate/Cargo.toml --all-targets --locked

  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Select stable Rust toolchain
        run: rustup override set stable
      - name: Build the examples
        run: cargo build --locked --release --examples --target ${{ matrix.target }}
      - name: Stage
        id: stage
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          name="minicore-runtime-$version-${{ matrix.target }}"
          mkdir -p "$name/examples"
          for example in agent_loop memory_agent; do
            cp "target/${{ matrix.target }}/release/examples/$example$EXE" "$name/examples/"
          done
          cp README.md "$name/"
          # A tarball keeps the executable bit, which artifact zips drop.
          if [ -z "$EXE" ]; then
            tar -czf "$name.tar.gz" "$name"
            echo "path=$name.tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "path=$name" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
